name: Build CLion plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Build installable ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify plugin
        run: ./gradlew test verifyPluginProjectConfiguration buildPlugin

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: loc-history-visualizer-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/distributions/*.zip --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
