name: LOC history

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build headless analyzer
        run: ./gradlew cliJar
      - name: Add PR delta to job summary
        if: github.event_name == 'pull_request'
        run: |
          java -jar build/libs/loc-history-visualizer-*-cli.jar \
            --branch HEAD --compare origin/${{ github.base_ref }} \
            --format markdown --quiet >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh tracked LOC report
        if: github.event_name == 'push'
        run: |
          java -jar build/libs/loc-history-visualizer-*-cli.jar \
            --branch HEAD --format markdown --commits 100 --quiet --output LOC_HISTORY.md
          if git diff --quiet -- LOC_HISTORY.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LOC_HISTORY.md
          git commit -m "docs: update LOC history [skip ci]"
          git push
